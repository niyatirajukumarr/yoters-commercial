name: CI

on:
  # Branch pushes are covered by the pull_request trigger. Listing '**' here as
  # well ran every job twice on each push to a PR branch — and the two runs did
  # not cancel each other, because the concurrency key below is github.ref,
  # which differs between a push event and a pull_request event.
  push:
    branches: [main]
    tags: ['v*']
  # `labeled` is included so the `ios` label actually starts the iOS job.
  # Without it, pull_request fires only on opened/synchronize/reopened, and
  # adding the label does nothing until the next push — which is not what the
  # job's own condition implies.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      release:
        description: 'Also build a signed Play bundle (needs the release secrets)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # scan-secrets --all reads the working tree, but a full history lets
          # the scan be pointed at a range later without a second fetch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Secret scan
        run: node scripts/scan-secrets.mjs --all

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  build-web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        # Placeholder values: the build only needs these to be present and
        # well-formed. Nothing here reaches a real project.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: https://example.com
        run: npm run build

  build-android:
    name: Android build (verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Verification, not a shippable artifact: this proves the export builds,
      # Gradle assembles and R8 does not strip anything the app needs at
      # runtime. It deliberately does NOT require the production secrets, so it
      # runs on every push and on pull requests from forks. Placeholders are
      # only substituted when a secret is absent, so a configured repository
      # verifies against its real values.
      - name: Build static app bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'rzp_test_placeholder' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://placeholder.invalid' }}
        run: npm run build:app

      - name: Sync Capacitor
        run: npx cap sync android

      # Two APKs, because one artifact cannot do both jobs.
      #
      # assembleRelease is the build that runs R8, so it is the only one that
      # proves a Capacitor keep rule is not missing. With no keystore it emits
      # an UNSIGNED apk — correct for a check that must run on untrusted forks,
      # but Android refuses to install an unsigned package
      # (INSTALL_PARSE_FAILED_NO_CERTIFICATES), so it cannot be tested on a
      # phone.
      #
      # assembleDebug is signed automatically with the local debug keystore, so
      # it installs and runs. It carries the .debug applicationIdSuffix, so it
      # sits alongside a store build rather than replacing it.
      - name: Assemble release (R8 verification, unsigned)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      # Sign the testing APK with a stable key when one is configured. Each
      # runner is a fresh machine, so without this Gradle invents a new random
      # debug keystore per build and Android rejects the update with
      # "App not installed" — a tester would have to uninstall every time.
      # Absent the secret, the build still works; the APK is just signed with
      # that run's throwaway key, as before.
      - name: Restore debug keystore
        id: debugkeystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.jks"
            echo "path=$RUNNER_TEMP/debug.jks" >> "$GITHUB_OUTPUT"
            echo "Using the configured stable debug key."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set — this APK is signed with a throwaway key, so installing it over a previous build will fail with 'App not installed'. See README."
          fi

      - name: Assemble debug (installable for testing)
        working-directory: android
        env:
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ steps.debugkeystore.outputs.path }}
          ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Remove debug keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/debug.jks"

      # The one to download and put on a phone.
      - uses: actions/upload-artifact@v4
        with:
          name: yoters-debug-apk-installable
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: yoters-release-apk-unsigned-do-not-install
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  build-ios:
    name: iOS build (verification)
    # macOS runners cost roughly 10x a Linux minute, so this does not run on
    # every push: it runs on main, on a manual dispatch, and on a PR that
    # actually touches the iOS project or the shared app pipeline.
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ios')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build static app bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'rzp_test_placeholder' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://placeholder.invalid' }}
        run: npm run build:app

      - name: Sync Capacitor
        run: npx cap sync ios

      # Compiles and links the real app without signing it. That catches a
      # broken Info.plist, a missing pod, or a plugin that does not build for
      # arm64 — everything short of the signing step, which needs an Apple
      # Developer account. Installing on a device or TestFlight is a separate,
      # credentialled job to add once that account exists.
      # -project, not -workspace. Capacitor 8 uses Swift Package Manager (the
      # plugins come in through CapApp-SPM/Package.swift), so it never generates
      # the App.xcworkspace that the older CocoaPods setup produced.
      - name: Build (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  release-android:
    name: Android release bundle (signed)
    # A v* tag, or a manual run that explicitly ticks the release box. Running
    # on every manual dispatch was wrong: the commonest reason to press "Run
    # workflow" is to rebuild the APK after changing a secret, and that would
    # fail here on the missing keystore and paint the whole run red for no
    # reason. This job touches signing material, so it also never runs on a
    # pull request.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Fail before doing any work if a required secret is missing, rather than
      # producing an artifact that is quietly wrong.
      - name: Check release configuration
        env:
          API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$API_BASE" ] || missing="$missing NEXT_PUBLIC_API_BASE_URL"
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Missing required release secret(s):$missing"
            exit 1
          fi

      - name: Restore keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build static app bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
        run: npm run build:app

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Bundle for Play
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: yoters-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
