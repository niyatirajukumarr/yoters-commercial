apply plugin: 'com.android.application'

android {
    namespace = "com.yoters.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.yoters.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is driven entirely by environment variables so no
    // keystore, password or alias ever lands in the repository. CI provides
    // them from encrypted secrets; a local release build reads them from the
    // shell. When they are absent the signingConfig is not applied and AGP
    // emits an unsigned APK, which Play refuses at upload — so a missing secret
    // produces an obviously unusable artifact rather than a plausible-looking
    // one signed with the wrong key.
    signingConfigs {
        // A stable key for the testing APK. Without one, every CI runner is a
        // fresh machine and Gradle auto-creates a RANDOM ~/.android/debug.keystore,
        // so each build is signed with a different key — and Android refuses to
        // update an installed app whose signature changed ("App not installed").
        // Testers would have to uninstall before every single update.
        //
        // Unset (a local build), this block is skipped and Gradle falls back to
        // its own debug keystore, which is correct: on one machine that key is
        // stable across builds anyway.
        debug {
            def debugStore = System.getenv("ANDROID_DEBUG_KEYSTORE_PATH")
            if (debugStore) {
                storeFile file(debugStore)
                storePassword System.getenv("ANDROID_DEBUG_KEYSTORE_PASSWORD") ?: "android"
                keyAlias System.getenv("ANDROID_DEBUG_KEY_ALIAS") ?: "androiddebugkey"
                keyPassword System.getenv("ANDROID_DEBUG_KEY_PASSWORD") ?: "android"
            }
        }

        release {
            def storePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Shrink and obfuscate. Beyond size, this strips the readable
            // symbol names an attacker would otherwise read straight out of the
            // APK.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Keeps a side-loaded debug build from overwriting a store install.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            if (System.getenv("ANDROID_DEBUG_KEYSTORE_PATH")) {
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
